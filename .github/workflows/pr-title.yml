name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: 'The title is "type: description"'
        # a squash merge makes the title the commit message on main, so the title carries the commit convention
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|ci|chore|refactor|test|perf|build|release)(\([a-z0-9-]+\))?!?: [^ ].{2,}$'; then
            echo "title ok: $TITLE"
          else
            echo "::error::The pull request title must be 'type: description', type one of feat, fix, docs, ci, chore, refactor, test, perf, build, release (see CONTRIBUTING.md)."
            exit 1
          fi
      - name: No AI co-author or attribution line
        # the title and body become the squash commit on main; an AI trailer there would list a model among the contributors
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n%s' "$TITLE" "$BODY" | grep -Eiq 'co-authored-by:.*(claude|anthropic|gemini|copilot|openai|codex|gpt)|noreply@anthropic\.com|generated with \[?(claude|gemini|copilot|codex)'; then
            echo "::error::Remove the AI co-author or 'Generated with' line from the pull request (see CONTRIBUTING.md)."
            exit 1
          fi
          echo "no AI attribution"
