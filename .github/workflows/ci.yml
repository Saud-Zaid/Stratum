name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the locked environment
        run: uv sync --locked --no-dev
      - name: Run the tests
        run: uv run python AI-Agent/scripts/run_tests.py
      - name: Audit the dependencies
        run: uvx pip-audit
