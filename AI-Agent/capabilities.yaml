# Capabilities contract

- "C1|Partial reading of large notes"
- "C2|Batch execution of scripts with readable output"
- "C3|Delegating a task to a subagent"
- "C4|A shared, importable Python library"
- "C5|A session log written to disk"
- "C6|Conditional writing (only if the file has not changed since it was read)"
